{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Eid Card Generator</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <div class="container">
      <h1>Eid Mubarak Gift Card Generator</h1>

      <form id="cardForm" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Enter your name" required />
        <textarea name="message" placeholder="Enter your message" required></textarea>
        <input type="file" name="image" accept="image/*" required>
        <button type="submit">Generate Link</button>
      </form>

      <div id="result"></div>

      <h2>Live Preview</h2>
      <div class="card-preview" id="card-preview">
        <h2 id="preview-name">Your Name</h2>
        <p id="preview-message">Your message</p>
        <img id="preview-image" src="" alt="" style="display:none; max-width:200px;" />
      </div>
    </div>

    <script src="{% static 'js/html2canvas.min.js' %}"></script>
    <script src="{% static 'js/script.js' %}"></script>
  </body>
</html>
